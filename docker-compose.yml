version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoJob_postgres
    environment:
      POSTGRES_USER: autoJob
      POSTGRES_PASSWORD: autoJob_password
      POSTGRES_DB: autoJob
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoJob -d autoJob"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoJob_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoJob_app
    environment:
      - DATABASE_URL=postgresql://autoJob:autoJob_password@postgres:5432/autoJob?schema=public
      - DIRECT_URL=postgresql://autoJob:autoJob_password@postgres:5432/autoJob?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-super-secret-key-change-in-production-min-32-chars
      - GOOGLE_CLIENT_ID=your-google-client-id
      - GOOGLE_CLIENT_SECRET=your-google-client-secret
      - LINKEDIN_CLIENT_ID=your-linkedin-client-id
      - LINKEDIN_CLIENT_SECRET=your-linkedin-client-secret
      - GEMINI_API_KEY=your-gemini-api-key
      - RAZORPAY_KEY_ID=rzp_test_xxx
      - RAZORPAY_KEY_SECRET=your-razorpay-secret
      - RAZORPAY_WEBHOOK_SECRET=your-webhook-secret
      - RESEND_API_KEY=re_xxx
      - EMAIL_FROM=noreply@localhost
      - UPSTASH_REDIS_REST_URL=http://redis:6379
      - UPSTASH_REDIS_REST_TOKEN=your-token
      - EXTENSION_HMAC_KEY=your-hmac-key-32-chars-minimum-length
      - COOKIE_ENCRYPTION_KEY=your-32-char-encryption-key-here
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  prisma-studio:
    image: node:20-alpine
    container_name: autoJob_prisma_studio
    working_dir: /app
    command: npx prisma studio --port 5555 --hostname 0.0.0.0
    environment:
      - DATABASE_URL=postgresql://autoJob:autoJob_password@postgres:5432/autoJob?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data: